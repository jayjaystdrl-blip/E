name: PillOverlay
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    DEVELOPMENT_TEAM: ""
targets:
  PillOverlay:
    type: application
    platform: iOS
    sources:
      - path: PillOverlay
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.PillOverlay
        INFOPLIST_FILE: PillOverlay/Info.plist
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
    entitlements:
      path: PillOverlay/PillOverlay.entitlements
    dependencies:
      - target: PillOverlayLiveActivity
  PillOverlayLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: PillOverlayLiveActivity
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.PillOverlay.LiveActivity
        INFOPLIST_FILE: PillOverlayLiveActivity/Info.plist
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    entitlements:
      path: PillOverlayLiveActivity/PillOverlayLiveActivity.entitlements
