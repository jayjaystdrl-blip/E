name: PillOverlay

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: 5.0

targets:
  PillOverlay:
    type: application
    platform: iOS

    sources:
      - path: .
        includes:
          - "*.swift"

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.PillOverlay
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"

    entitlements:
      path: PillOverlay.entitlements
