name: PillOverlay

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: 5.0

targets:
  PillOverlay:
    type: application
    platform: iOS

    sources:
      - path: ContentView.swift
      - path: FloatingPillView.swift
      - path: LiveActivityController.swift
      - path: NotificationManager.swift
      - path: PillOverlayApp.swift

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.PillOverlay
        INFOPLIST_FILE: Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic

    entitlements:
      path: PillOverlay.entitlements
